<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Анкеты для меня</title>
    <link rel="stylesheet" href="style_form.css">
  </head>

  <body>
     <header>
      <nav class="topbar">
        <a href="index.html" class="logo-link">
          <img src="img/logo1.jpg" alt="Sofia Forms Logo" class="logo-img">
        </a>
        <ul class="nav-links">
          <li><a href="forme.html">Personal Forms</a></li>
          <li><a href="education.html">Education Forms</a></li>
        </ul>
      </nav>
    </header>
    
    <form id="main-form">
      <h2>Please identify yourself</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">

      <label for="lastname">Lastname:</label>
      <input type="text" id="lastname" name="lastname" placeholder="Enter your last name">

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="0" max="120" placeholder="e.g. 14">

      <h2>Please fill out the following information:</h2>

      <label for="color">Your favorite color:</label>
      <select id="color" name="color">
        <option value="" disabled selected>Choose a color</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="purple">Purple</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
        <option value="orange">Orange</option>
        <option value="black">Black</option>
      </select>

      <label for="info">Additional Information:</label>
      <textarea id="info" name="info" rows="4" placeholder="Anything you want to share..."></textarea>


      <label for="about">About yourself:</label>
      <textarea id="about" name="about" rows="20" placeholder="Tell us about yourself..."></textarea>
      <button type="submit">Submit</button>
    </form>

    <footer class="site-footer"></footer>
  </body>
</html>
